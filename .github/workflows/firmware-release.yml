name: firmware-release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('firmware/**/platformio.ini') }}

      - name: Install PlatformIO and esptool
        run: |
          python -m pip install --upgrade pip
          pip install platformio esptool

      - name: Build the firmware
        run: pio run -d firmware/sr_support_b_ptk

      - name: Merge the factory image
        run: |
          BOOTAPP=$(find ~/.platformio/packages -name boot_app0.bin | head -1)
          B=firmware/sr_support_b_ptk/.pio/build/ptk7452
          python -m esptool --chip esp32s3 merge-bin \
            -o sr_support_b_ptk_factory.bin \
            --flash-mode dio --flash-freq 80m --flash-size 8MB \
            0x0 "$B/bootloader.bin" 0x8000 "$B/partitions.bin" \
            0xe000 "$BOOTAPP" 0x10000 "$B/firmware.bin"
          sha256sum sr_support_b_ptk_factory.bin > SHA256SUMS
          cat SHA256SUMS

      - name: Attach the image to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            sr_support_b_ptk_factory.bin
            SHA256SUMS

      - name: Upload artifacts for manual runs
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: factory-image
          path: |
            sr_support_b_ptk_factory.bin
            SHA256SUMS
