; PlatformIO project for the B-line (PTK7452MG, 180 deg PWM).
;
;   pio run -d firmware/sr_support_b_ptk -t upload
;   pio device monitor --rts 0 --dtr 0 -b 115200
;
; The adapter board is a passive pass-through: ESP32 GPIO -> servo headers,
; shared servo V+/GND rail. There is no PCA9685/GPIO expander here.
;
; This build does NOT link the Feetech SCServo library (that is A-line/GPLv3).
; The firmware is based on Juxi-Technology/2dof-selfrighting-robot
; (MIT/Apache-2.0); see third_party/juxi-2dof/.

[platformio]
default_envs = ptk7452

[env:ptk7452]
; Pinned for reproducible builds: verified with espressif32 8.0.0 /
; Arduino core 3.3.12 on 2026-10-20.
platform = espressif32@8.0.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags =
    -O2
    -DCORE_DEBUG_LEVEL=0
