; Bench sketch: both servos to 1520 us so the horns can be installed at the
; electrical center BEFORE the arms are assembled. Does not use the IMU.
;
;   pio run -d firmware/servo_center_ptk -t upload --upload-port COM27
;   pio device monitor --rts 0 --dtr 0 -b 115200 -p COM27
;
; Serial commands while running: 1/2 select, +/- nudge 10 us, p print.

[platformio]
default_envs = servocenter

[env:servocenter]
platform = espressif32@8.0.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags =
    -O2
    -DCORE_DEBUG_LEVEL=0
